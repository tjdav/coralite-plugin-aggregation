
<template id="blog-list">
  <div class="list">{{ content }}</div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server: async (context) => {
      const content = await context.aggregation.aggregate({
        path: ['blog'],
        component: 'coralite-post',
        limit: 2,
        recursive: false,
        pagination: {
          segment: 'p',
          maxVisible: 3,
          ariaLabel: 'Blog Pagination',
          ellipsis: '---'
        }
      })

      // Bridge the computed HTML nodes to the dumb template
      return {
        content
      }
    }
  })
</script>
